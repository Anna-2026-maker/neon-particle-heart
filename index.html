<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霓虹粒子爱心</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#030204;color:#fff;font-family:ui-monospace,monospace}main,canvas{position:absolute;inset:0;width:100%;height:100%}.code{position:absolute;inset:-40% 7%;opacity:.35;color:#77566f;font-size:11px;line-height:22px;white-space:pre;animation:scroll 28s linear infinite}.shade{position:absolute;inset:0;background:radial-gradient(circle,#19051122,#020203cc 78%)}canvas{touch-action:none;cursor:pointer}.tools{position:absolute;z-index:3;right:28px;bottom:22px;display:flex;gap:8px}.tools button{height:40px;padding:0 17px;border:1px solid #442b39;border-radius:999px;background:#120a10cc;color:#bc91ab;cursor:pointer}.tools .hot{color:#fff;background:#d71990;border-color:#d71990}.hint{position:absolute;z-index:2;left:50%;bottom:35px;transform:translateX(-50%);color:#806173;font-size:10px;pointer-events:none}.phase{position:absolute;z-index:2;left:28px;bottom:35px;color:#9a7189;font-size:10px}.phase i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#ff2baa;box-shadow:0 0 12px #ff2baa;margin-right:8px}@keyframes scroll{to{transform:translateY(-33%)}}@media(max-width:640px){.tools{left:20px;right:20px}.tools button{flex:1}.hint{bottom:76px}.phase{top:22px;bottom:auto}.code{font-size:9px;line-height:18px}}
</style></head><body><main><pre class="code" id="code"></pre><div class="shade"></div><canvas id="c"></canvas><div class="phase"><i></i><span id="phase">聚合</span></div><div class="hint">点击画面 · 提前触发爆发</div><div class="tools"><button id="pause">暂停动画</button><button id="replay" class="hot">重新播放</button></div></main><script>
const py=`import math, random\n\ndef heart_point(t, radius):\n    x = 16 * math.sin(t) ** 3\n    y = -(13*math.cos(t)-5*math.cos(2*t)-2*math.cos(3*t)-math.cos(4*t))\n    return x*radius, y*radius\n\nwhile running:\n    phase = timeline(time % 8)\n    update_particles(phase)\n    render_transparent_layer()\n`;code.textContent=(py+'\n').repeat(14);
const c=document.querySelector('#c'),x=c.getContext('2d'),label=document.querySelector('#phase');let W,H,D,P=[],time=0,paused=false,last=performance.now();const clamp=v=>Math.max(0,Math.min(1,v)),ease=t=>{t=clamp(t);return t*t*(3-2*t)};
function make(){P=[];let n=W<650?650:1100;for(let i=0;i<n;i++){let t=Math.random()*Math.PI*2,r=Math.sqrt(Math.random()),hx=16*Math.sin(t)**3*r,hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*r,a=Math.random()*Math.PI*2;P.push({x:hx,y:hy,z:(Math.random()-.5)*7,sx:(Math.random()-.5)*90,sy:(Math.random()-.5)*65,vx:Math.cos(a)*(.7+Math.random()*3),vy:Math.sin(a)*(.7+Math.random()*3)-1,size:.6+Math.random()*2.4,h:Math.random()>.2?325:292,q:Math.random()*99})}}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);make()}addEventListener('resize',resize);resize();
function draw(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(!paused)time+=dt;let t=time%8,s=Math.min(W,H)*(W<650?.0175:.0205),cx=W/2,cy=H/2,phase=t<1?'聚合':t<3.2?'旋转':t<3.6?'蓄能':t<5.2?'爆发':t<7?'回流':'完成';label.textContent=phase;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';for(let p of P){let px,py,z=p.z,a=1,rot=0;if(t<1){let e=ease(t);px=p.sx*(1-e)+p.x*e;py=p.sy*(1-e)+p.y*e;a=.2+.8*e}else if(t<3.2){rot=(t-1)*1.2;px=p.x*Math.cos(rot)+p.z*Math.sin(rot);z=-p.x*Math.sin(rot)+p.z*Math.cos(rot);py=p.y}else if(t<3.6){let q=(t-3.2)/.4,j=Math.sin(q*38+p.q)*q*1.7;px=p.x*Math.cos(2.64)+p.z*Math.sin(2.64)+j;py=p.y+j*.5}else if(t<5.2){let e=(t-3.6)/1.6,k=(1-Math.exp(-e*5))*42;px=p.x*Math.cos(2.64)+p.z*Math.sin(2.64)+p.vx*k;py=p.y+p.vy*k+e*e*26;a=1-ease((e-.45)/.55)*.82}else if(t<7){let e=ease((t-5.2)/1.8),ex=p.x*Math.cos(2.64)+p.z*Math.sin(2.64)+p.vx*42,ey=p.y+p.vy*42+26,rr=2.64*(1-e),home=p.x*Math.cos(rr)+p.z*Math.sin(rr);px=ex*(1-e)+home*e;py=ey*(1-e)+p.y*e;a=.2+.8*e}else{px=p.x;py=p.y}let tw=.55+.45*Math.sin(now*.006+p.q*3),X=cx+px*s,Y=cy+py*s,r=p.size*(phase==='蓄能'?1.4:1);x.globalAlpha=a*(.45+tw*.5);x.fillStyle=`hsl(${p.h} 100% ${65+tw*13}%)`;x.shadowColor=x.fillStyle;x.shadowBlur=10+r*3;x.beginPath();x.arc(X,Y,r,0,7);x.fill()}x.globalAlpha=1;x.globalCompositeOperation='source-over';requestAnimationFrame(draw)}requestAnimationFrame(draw);
c.onpointerdown=()=>time=3.25;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续动画':'暂停动画'};document.querySelector('#replay').onclick=()=>time=0;
</script></body></html>
